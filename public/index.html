<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTC/ETH Divergence Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>BTC/ETH Divergence Tracker</h1>
      <a href="/charts.html">K線圖</a>
      <button id="new-record" type="button">+ 新增</button>
    </header>
    <p class="utc-note">所有時間皆為 UTC</p>

    <div id="filters">
      <label>類型
        <select id="type-filter">
          <option value="">全部</option>
          <option value="time_lag">時間差</option>
          <option value="structural">結構背離</option>
          <option value="opposite">完全反向</option>
        </select>
      </label>
      <label>標籤
        <input id="tag-filter" type="search" placeholder="搜尋標籤（部分符合）" autocomplete="off" />
      </label>
      <p id="filter-error" hidden></p>
    </div>

    <main>
      <table id="records-table">
        <thead>
          <tr>
            <th>#</th>
            <th>開始時間 (UTC)</th>
            <th>結束時間 (UTC)</th>
            <th>類型</th>
            <th>備註</th>
            <th>標籤</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <dialog id="record-dialog">
      <form id="record-form">
        <h2 id="dialog-title">新增記錄</h2>
        <label>
          開始時間 (UTC)
          <span class="time-picker" data-picker="start">
            <select data-part="year"></select> 年
            <select data-part="month"></select> 月
            <select data-part="day"></select> 日
            <select data-part="hour"></select> 時
          </span>
        </label>
        <label>
          結束時間 (UTC)
          <span class="time-picker" data-picker="end">
            <select data-part="year"></select> 年
            <select data-part="month"></select> 月
            <select data-part="day"></select> 日
            <select data-part="hour"></select> 時
          </span>
        </label>
        <fieldset>
          <legend>類型</legend>
          <label><input type="radio" name="type" value="time_lag" checked /> 時間差</label>
          <label><input type="radio" name="type" value="structural" /> 結構背離</label>
          <label><input type="radio" name="type" value="opposite" /> 完全反向</label>
        </fieldset>
        <label>
          備註
          <textarea id="notes" rows="3"></textarea>
        </label>
        <label>
          標籤
          <input id="tags" type="text" autocomplete="off" />
        </label>
        <p id="form-error" hidden></p>
        <div class="dialog-actions">
          <button id="cancel-record" type="button">取消</button>
          <button id="save-record" type="button">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog">
      <h2>刪除記錄</h2>
      <p id="delete-summary"></p>
      <p id="delete-error" hidden></p>
      <div class="dialog-actions">
        <button id="cancel-delete" type="button">取消</button>
        <button id="confirm-delete" type="button">確認刪除</button>
      </div>
    </dialog>

    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/records.js"></script>
  </body>
</html>
