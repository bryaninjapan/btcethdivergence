<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTC/ETH Divergence Tracker — K線圖</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js" integrity="sha384-KkYqTZlM13Zya6fVUF3IGCBOQ1ehFeJVVgxaVvD/0MebineF9EI8Jkd3nNnWNChqN" crossorigin="anonymous"></script>
  </head>
  <body>
    <header>
      <h1>BTC/ETH Divergence Tracker</h1>
      <a href="/">← 記錄表</a>
    </header>
    <main>
      <p id="chart-loading" style="color: #666;">載入中...</p>
      <p id="chart-error" hidden></p>
      <section class="chart-controls">
        <label class="chart-controls__check">
          <input type="checkbox" id="log-scale" />
          對數縮放
        </label>
        <label>
          開始時間 (UTC)
          <span class="time-picker" data-picker="start">
            <select data-part="year"></select> 年
            <select data-part="month"></select> 月
            <select data-part="day"></select> 日
            <select data-part="hour"></select> 時
          </span>
        </label>
        <label>
          結束時間 (UTC)
          <span class="time-picker" data-picker="end">
            <select data-part="year"></select> 年
            <select data-part="month"></select> 月
            <select data-part="day"></select> 日
            <select data-part="hour"></select> 時
          </span>
        </label>
        <button id="load-range" type="button">載入範圍</button>
        <p id="range-summary" class="range-summary"></p>
      </section>
      <section class="chart-pane">
        <h3>BTCUSDT 1h</h3>
        <div id="btc-chart"></div>
      </section>
      <section class="chart-pane">
        <h3>ETHUSDT 1h</h3>
        <div id="eth-chart"></div>
      </section>
    </main>
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/charts.js"></script>
  </body>
</html>
